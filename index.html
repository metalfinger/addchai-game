<!DOCTYPE html>
<html lang="en">
	<head>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
		<link rel="stylesheet" type="text/css" href="style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/png" href="faviconV2.png" />
		<link rel="shortcut icon" type="image/png" href="faviconV2.png" />
		<link rel="apple-touch-icon" href="faviconV2.png" />
		<meta charset="utf-8" />
	</head>
	<body>
		<main style="height: 100%; width: 100%"></main>

		<!-- Firebase Scripts -->
		<script type="module">
			// Import the functions you need from the SDKs you need
			import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
			import {
				getFirestore,
				collection,
				addDoc,
				getDocs,
				query,
				orderBy,
				limit,
			} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

			// Your web app's Firebase configuration
			// IMPORTANT: Replace these with your actual Firebase config values.
			// For production, it's recommended to load these from a secure environment
			// (e.g., using environment variables and a backend proxy) instead of hardcoding them here.
			const firebaseConfig = {
				apiKey: "YOUR_API_KEY",
				authDomain: "YOUR_AUTH_DOMAIN",
				projectId: "YOUR_PROJECT_ID",
				storageBucket: "YOUR_STORAGE_BUCKET",
				messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
				appId: "YOUR_APP_ID",
			};

			// Initialize Firebase
			const app = initializeApp(firebaseConfig);
			const db = getFirestore(app);

			// Make Firebase functions available globally
			window.firebaseDB = db;
			window.firebaseAddDoc = addDoc;
			window.firebaseCollection = collection;
			window.firebaseGetDocs = getDocs;
			window.firebaseQuery = query;
			window.firebaseOrderBy = orderBy;
			window.firebaseLimit = limit;
		</script>

		<script src="sketch.js"></script>
	</body>
</html>
